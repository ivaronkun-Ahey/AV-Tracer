# Обновления зависимостей партиями: раз в неделю, мелкие обновления сгруппированы,
# крупные (major) — отдельными pull request для ручной проверки.
# Работает после слияния в основную ветку.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      runtime:
        dependency-type: production
        update-types: [minor, patch]
      dev-tools:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: monthly
