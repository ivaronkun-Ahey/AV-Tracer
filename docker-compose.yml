# AV-Tracer — запуск всего приложения одной командой:
#   docker compose up
# Открыть в браузере: http://localhost:3000
#
# Состав сведён к необходимому: backend (API симуляции) и frontend (интерфейс).
# Внешние СУБД не требуются — приложение их не использует.

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      # Адрес backend для прокси Vite (/api -> backend)
      - BACKEND_URL=http://backend:8000
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
    depends_on:
      - backend
